# Demo overlay: TomatoMeter fully integrated with SPACE, built from ../demo.
services:
  tomatometer-server:
    build: { context: ../demo, dockerfile: docker/server.Dockerfile }
    environment: { SPACE_LAB_CONFIGURATION_FILE: /lab/space.json }
    volumes: [lab-config:/lab:ro]
    depends_on:
      lab-bootstrap:
        condition: service_completed_successfully
    networks: [lab]
  tomatometer-client:
    build: { context: ../demo, dockerfile: docker/client.Dockerfile, args: { VITE_SERVER_URL: http://localhost:5401/api } }
    depends_on: [tomatometer-server]
    networks: [lab]
  tomatometer-nginx:
    image: nginx:1.27.3-alpine
    ports: ["5401:80"]
    volumes: [./nginx/tomatometer.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [tomatometer-server, tomatometer-client]
    networks: [lab]
