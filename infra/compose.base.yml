# SPHERE + SPACE, shared by the demo and every tutorial checkpoint.
# Start it through `npm run demo` / `npm run tutorial:N` (scripts/lab.mjs), which
# adds the TomatoMeter overlay and sets LAB_STAGE for the bootstrap.
name: tomatometer-lab

services:
  sphere-mongodb:
    image: mongo:7.0.16
    environment: { MONGO_INITDB_ROOT_USERNAME: root, MONGO_INITDB_ROOT_PASSWORD: lab-root-password, MONGO_INITDB_DATABASE: sphere_lab, DATABASE_NAME: sphere_lab, DATABASE_USERNAME: testUser, DATABASE_PASSWORD: testUser }
    volumes: [sphere-data:/data/db, ./mongo/sphere-init.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro]
    networks: [lab]
  sphere-redis:
    image: redis:7.4.2
    networks: [lab]
  sphere-server:
    image: ghcr.io/scorelabus/sphere-api:${SPHERE_VERSION:-2.6.0}
    environment:
      ENVIRONMENT: lab
      DATABASE_TECHNOLOGY: mongoDB
      SERVER_PORT: 8080
      MONGO_PROTOCOL: mongodb
      MONGO_HOST: sphere-mongodb
      MONGO_PORT: 27017
      DATABASE_NAME: sphere_lab
      DATABASE_USERNAME: testUser
      DATABASE_PASSWORD: testUser
      MONGO_AUTH_SOURCE: sphere_lab
      SERVER_STATICS_FOLDER: public/
      # Browser-facing static files use the published proxy, not a Docker IP.
      SERVER_HOST: http://localhost:5402
      REDIS_URL: redis://sphere-redis:6379
      JWT_SECRET: tomato-lab-sphere-jwt-secret
      JWT_EXPIRATION: 24h
      # Used by SPACE to retrieve manifests from inside the lab network.
      SPHERE_PUBLIC_URL: http://sphere-server:8080
      FRONTEND_URL: http://localhost:5402
    # Published YAML files must survive a Sphere application-container rebuild.
    volumes: [sphere-pricings:/usr/src/server/public/static/pricings]
    depends_on: [sphere-mongodb, sphere-redis]
    healthcheck:
      test: [CMD-SHELL, "node -e \"require('http').get('http://localhost:8080/api/v1/healthcheck', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lab]
  sphere-client:
    image: ghcr.io/scorelabus/sphere-client:${SPHERE_VERSION:-2.6.0}
    networks: [lab]
  sphere-nginx:
    image: nginx:1.27.3-alpine
    ports: ["5402:80"]
    volumes: [./nginx/sphere.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [sphere-server, sphere-client]
    networks: [lab]

  space-mongodb:
    image: mongo:7.0.16
    environment: { MONGO_INITDB_ROOT_USERNAME: root, MONGO_INITDB_ROOT_PASSWORD: 4dm1n, MONGO_INITDB_DATABASE: space_lab, DATABASE_NAME: space_lab, DATABASE_USERNAME: mongoUser, DATABASE_PASSWORD: mongoPassword }
    volumes: [space-data:/data/db, ./mongo/space-init.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --username root --password 4dm1n --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lab]
  space-redis:
    image: redis:7.4.2
    networks: [lab]
  space-server:
    image: ghcr.io/scorelabus/space-api:${SPACE_VERSION:-1.7.1}
    environment:
      ENVIRONMENT: lab
      SERVER_PORT: 3000
      MONGO_URI: mongodb://mongoUser:mongoPassword@space-mongodb:27017/space_lab?authSource=space_lab
      REDIS_URL: redis://space-redis:6379
      JWT_SECRET: tomato-lab-space-jwt-secret
      JWT_SALT: tomato-lab-space-jwt-salt
      ADMIN_USER: tomato_demo
      ADMIN_PASSWORD: tomato-demo
      ADMIN_ORG_NAME: TomatoMeter Lab
      # SPHERE's UI copies permanent links as http://localhost:5402/p/{id}. SPACE
      # accepts and fetches exactly those links; space-sphere-link makes that
      # address reach SPHERE from inside this container.
      SPHERE_PUBLIC_URL: http://localhost:5402
      SPHERE_API_URL: http://localhost:5402/api/v1
      SPHERE_ALLOW_LOCAL_HTTP: "true"
      SPHERE_SYNC_ENABLED: "true"
    depends_on:
      space-mongodb:
        condition: service_healthy
      space-redis:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "node -e \"require('http').get('http://localhost:3000/api/v1/healthcheck', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lab]
  # Shares space-server's network namespace and forwards its localhost:5402 to
  # SPHERE, so the links attendees copy from SPHERE work as-is in SPACE.
  space-sphere-link:
    image: nginx:1.27.3-alpine
    network_mode: service:space-server
    volumes: [./nginx/space-sphere-link.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [space-server, sphere-nginx]
  space-client:
    image: ghcr.io/scorelabus/space-client:${SPACE_VERSION:-1.7.1}
    depends_on: [space-server]
    networks: [lab]
  space-nginx:
    image: nginx:1.27.3-alpine
    ports: ["5403:5403"]
    volumes: [./nginx/space.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [space-server, space-client]
    networks: [lab]

  verify-sphere-demo-user:
    image: mongo:7.0.16
    depends_on:
      sphere-server:
        condition: service_healthy
    command: [sh, -c, "until mongosh --quiet 'mongodb://root:lab-root-password@sphere-mongodb:27017/sphere_lab?authSource=admin' --eval \"const user = db.users.findOne({username: 'tomato_demo'}); if (!user) quit(1); const patch = {}; patch[String.fromCharCode(36) + 'set'] = {emailVerified: true, emailVerifiedAt: new Date()}; db.users.updateOne({_id: user._id}, patch);\"; do sleep 1; done"]
    networks: [lab]
  # Provisions SPHERE and SPACE up to the requested stage:
  #   empty   -> demo user in SPHERE and SPACE only            (tutorial checkpoint 1)
  #   pricing -> + TomatoMeter pricing published in SPHERE     (tutorial checkpoint 2)
  #   linked  -> + SPACE service linked to that pricing        (tutorial checkpoint 3)
  #   demo    -> + contracts and SPACE config for the demo app
  lab-bootstrap:
    image: node:22-alpine
    environment:
      LAB_STAGE: ${LAB_STAGE:-demo}
    depends_on:
      sphere-server:
        condition: service_healthy
      verify-sphere-demo-user:
        condition: service_started
      space-server:
        condition: service_healthy
      space-sphere-link:
        condition: service_started
    volumes:
      - ../demo/api/resources/TomatoMeter.yml:/workspace/TomatoMeter.yml:ro
      - ./bootstrap/bootstrap.mjs:/workspace/bootstrap.mjs:ro
      - lab-config:/lab
    command: [node, /workspace/bootstrap.mjs]
    networks: [lab]

volumes: { sphere-data: {}, sphere-pricings: {}, space-data: {}, lab-config: {} }
networks: { lab: {} }
