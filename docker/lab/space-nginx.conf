server {
    listen 5403;
    client_max_body_size 100M;

    # Docker can assign a new address when an application container is recreated.
    # Resolve services at request time instead of retaining an obsolete address.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $space_server space-server;
        proxy_pass http://$space_server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        set $space_server space-server;
        proxy_pass http://$space_server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /events/ {
        set $space_server space-server;
        proxy_pass http://$space_server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        set $space_client space-client;
        proxy_pass http://$space_client:80;
        # The published client has SPHERE's production URL compiled in. Rewrite it
        # to the lab's SPHERE so links open the local instance.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'https://sphere.score.us.es' 'http://localhost:5402';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
