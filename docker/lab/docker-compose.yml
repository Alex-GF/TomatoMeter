name: tomatometer-lab

services:
  sphere-mongodb:
    image: mongo:7.0.16
    environment: { MONGO_INITDB_ROOT_USERNAME: root, MONGO_INITDB_ROOT_PASSWORD: lab-root-password, MONGO_INITDB_DATABASE: sphere_lab, DATABASE_NAME: sphere_lab, DATABASE_USERNAME: testUser, DATABASE_PASSWORD: testUser }
    volumes: [sphere-data:/data/db, ../../../SPHERE/api/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro]
    networks: [lab]
  sphere-redis:
    image: redis:7.4.2
    networks: [lab]
  sphere-server:
    build: { context: ../../../SPHERE/api, dockerfile: docker/Dockerfile }
    environment:
      ENVIRONMENT: lab
      DATABASE_TECHNOLOGY: mongoDB
      SERVER_PORT: 8080
      MONGO_PROTOCOL: mongodb
      MONGO_HOST: sphere-mongodb
      MONGO_PORT: 27017
      DATABASE_NAME: sphere_lab
      DATABASE_USERNAME: testUser
      DATABASE_PASSWORD: testUser
      MONGO_AUTH_SOURCE: sphere_lab
      SERVER_STATICS_FOLDER: public/
      # Browser-facing static files use the published proxy, not a Docker IP.
      SERVER_HOST: http://localhost:5402
      REDIS_URL: redis://sphere-redis:6379
      JWT_SECRET: tomato-lab-sphere-jwt-secret
      JWT_EXPIRATION: 24h
      # Used by SPACE to retrieve manifests from inside the lab network.
      SPHERE_PUBLIC_URL: http://sphere-server:8080
      FRONTEND_URL: http://localhost:5402
    # Published YAML files must survive a Sphere application-container rebuild.
    volumes: [sphere-pricings:/usr/src/server/public/static/pricings]
    depends_on: [sphere-mongodb, sphere-redis]
    healthcheck:
      test: [CMD-SHELL, "node -e \"require('http').get('http://localhost:8080/api/v1/healthcheck', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lab]
  sphere-client:
    build:
      context: ../../../SPHERE/frontend
      dockerfile: ../../TomatoMeter/docker/lab/sphere-client.Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SECRET_KEY: tomato-lab-sphere-client-secret
    volumes: [./sphere-client-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [lab]
  sphere-nginx:
    image: nginx:1.27.3-alpine
    ports: ["5402:80"]
    volumes: [./sphere-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [sphere-server, sphere-client]
    networks: [lab]

  space-mongodb:
    image: mongo:7.0.16
    environment: { MONGO_INITDB_ROOT_USERNAME: root, MONGO_INITDB_ROOT_PASSWORD: 4dm1n, MONGO_INITDB_DATABASE: space_lab, DATABASE_NAME: space_lab, DATABASE_USERNAME: mongoUser, DATABASE_PASSWORD: mongoPassword }
    volumes: [space-data:/data/db, ../../../space-api/api/src/main/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --username root --password 4dm1n --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lab]
  space-redis:
    image: redis:7.4.2
    networks: [lab]
  space-server:
    build: { context: ../../../space-api/api, dockerfile: docker/local/Dockerfile }
    environment:
      ENVIRONMENT: lab
      SERVER_PORT: 3000
      MONGO_URI: mongodb://mongoUser:mongoPassword@space-mongodb:27017/space_lab?authSource=space_lab
      REDIS_URL: redis://space-redis:6379
      JWT_SECRET: tomato-lab-space-jwt-secret
      JWT_SALT: tomato-lab-space-jwt-salt
      ADMIN_USER: tomato_demo
      ADMIN_PASSWORD: tomato-demo
      ADMIN_ORG_NAME: TomatoMeter Lab
      # Do not route the server-to-server integration through the UI proxy.
      # It may not be running yet while the lab is being provisioned.
      SPHERE_PUBLIC_URL: http://sphere-server:8080
      SPHERE_API_URL: http://sphere-server:8080/api/v1
      SPHERE_ALLOW_LOCAL_HTTP: "true"
      SPHERE_LOCAL_HTTP_HOSTS: sphere-server
      SPHERE_SYNC_ENABLED: "true"
    depends_on:
      space-mongodb:
        condition: service_healthy
      space-redis:
        condition: service_started
    command: [node, dist/index.js]
    healthcheck:
      test: [CMD-SHELL, "node -e \"require('http').get('http://localhost:3000/api/v1/healthcheck', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [lab]
  space-client:
    build:
      context: ../../../space-api/frontend
      dockerfile: docker/local/Dockerfile
      # Production frontend behavior: show the real login screen instead of
      # authenticating automatically as devUser.
      args: { VITE_ENVIRONMENT: production, VITE_SPACE_BASE_URL: http://localhost:5403/api/v1, SPHERE_PUBLIC_URL: "${SPHERE_PUBLIC_URL:-http://localhost:5402}" }
    depends_on: [space-server]
    networks: [lab]
  space-nginx:
    image: nginx:1.27.3-alpine
    ports: ["5403:5403"]
    volumes: [./space-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [space-server, space-client]
    networks: [lab]

  clean-sphere-pricings:
    image: mongo:7.0.16
    depends_on:
      sphere-server:
        condition: service_healthy
    volumes: [./clean-sphere-pricings.js:/scripts/clean.js:ro]
    command: [mongosh, "mongodb://root:lab-root-password@sphere-mongodb:27017/sphere_lab?authSource=admin", /scripts/clean.js]
    networks: [lab]
  verify-sphere-demo-user:
    image: mongo:7.0.16
    depends_on:
      clean-sphere-pricings:
        condition: service_completed_successfully
    command: [sh, -c, "until mongosh --quiet 'mongodb://root:lab-root-password@sphere-mongodb:27017/sphere_lab?authSource=admin' --eval \"const user = db.users.findOne({username: 'tomato_demo'}); if (!user) quit(1); const patch = {}; patch[String.fromCharCode(36) + 'set'] = {emailVerified: true, emailVerifiedAt: new Date()}; db.users.updateOne({_id: user._id}, patch);\"; do sleep 1; done"]
    networks: [lab]
  lab-bootstrap:
    image: node:22-alpine
    depends_on:
      clean-sphere-pricings:
        condition: service_completed_successfully
      verify-sphere-demo-user:
        condition: service_started
      space-server:
        condition: service_healthy
    volumes: [../../api/resources/TomatoMeter.yml:/workspace/TomatoMeter.yml:ro, lab-config:/lab, ./bootstrap.mjs:/workspace/bootstrap.mjs:ro]
    command: [node, /workspace/bootstrap.mjs]
    networks: [lab]
  tomatometer-server:
    build: { context: ../.., dockerfile: api/docker/Dockerfile, args: { VITE_SPACE_URL: http://space-nginx:5403 } }
    environment: { SPACE_LAB_CONFIGURATION_FILE: /lab/space.json }
    volumes: [lab-config:/lab:ro]
    depends_on:
      lab-bootstrap:
        condition: service_completed_successfully
    networks: [lab]
  tomatometer-client:
    build: { context: ../.., dockerfile: docker/lab/tomatometer-client.Dockerfile, args: { VITE_SERVER_URL: http://localhost:5401/api } }
    depends_on: [tomatometer-server]
    networks: [lab]
  tomatometer-nginx:
    image: nginx:1.27.3-alpine
    ports: ["5401:80"]
    volumes: [./tomatometer-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [tomatometer-server, tomatometer-client]
    networks: [lab]

volumes: { sphere-data: {}, sphere-pricings: {}, space-data: {}, lab-config: {} }
networks: { lab: {} }
